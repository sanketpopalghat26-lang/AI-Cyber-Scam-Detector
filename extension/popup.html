<!doctype html>
<html>
  <body style="width:320px;padding:14px;font-family:Inter,Arial,sans-serif;background:#07111f;color:#f8fafc">
    <h3 style="margin:0 0 8px">AI Cyber Scam Detector</h3>
    <p id="status" style="margin:0 0 12px;color:#cbd5e1">Ready to scan the current page.</p>
    <button id="scan" style="width:100%;padding:10px 12px;border:0;border-radius:10px;background:linear-gradient(135deg,#38bdf8,#8b5cf6);color:white;font-weight:600;cursor:pointer">Scan Page</button>
    <script>
      document.getElementById('scan').addEventListener('click', async () => {
        const [tab] = await chrome.tabs.query({ active: true, currentWindow: true })
        chrome.scripting.executeScript({ target: { tabId: tab.id }, files: ['content_script.js'] })
        document.getElementById('status').innerText = 'Scan triggered on page.'
      })
    </script>
  </body>
</html>
