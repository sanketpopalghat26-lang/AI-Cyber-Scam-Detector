version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: scam_user
      POSTGRES_PASSWORD: scam_dev_pass
      POSTGRES_DB: scamdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scam_user -d scamdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --save 60 1

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://scam_user:scam_dev_pass@db:5432/scamdb
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-do-not-use-in-prod
      - MODEL_PATH=/app/model/best_model.pkl
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models/exports:/app/model:ro
      - ./backend/app:/app/app:ro
      - backend_logs:/app/logs
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://localhost:8000

volumes:
  pgdata:
  redis_data:
  backend_logs:

