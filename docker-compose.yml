services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scam_pass}
      POSTGRES_DB: ${POSTGRES_DB:-scamdb}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-scam_user}:${POSTGRES_PASSWORD:-scam_pass}@db:5432/${POSTGRES_DB:-scamdb}
      - MODEL_PATH=/app/model/best_model.pkl
      - SECRET_KEY=${SECRET_KEY:-dev-only-change-in-prod}
      - APP_ENV=${APP_ENV:-development}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./models/exports:/app/model:ro

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

volumes:
  pgdata:
