# =============================================================================
# CI Pipeline — AI Cyber Scam Detector
# =============================================================================
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Lint & Format Check
  # ===========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy black isort
          pip install -r backend/requirements.txt

      - name: Run Ruff
        run: ruff check backend/ enterprise_pipeline/ --output-format=github

      - name: Run Black
        run: black --check backend/ enterprise_pipeline/

      - name: Run isort
        run: isort --check-only --diff backend/ enterprise_pipeline/

      - name: Run mypy
        run: mypy backend/ enterprise_pipeline/ --ignore-missing-imports || true

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit
          pip install -r backend/requirements.txt

      - name: Run Bandit
        run: bandit -r backend/ enterprise_pipeline/ -f json -o bandit-report.json || true

      - name: Run pip-audit
        run: pip-audit -r backend/requirements.txt || true

      - name: Run Safety
        run: safety check -r backend/requirements.txt --full-report || true

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30

  # ===========================================================================
  # Unit Tests
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: scam_user
          POSTGRES_PASSWORD: scam_pass
          POSTGRES_DB: scamdb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://scam_user:scam_pass@localhost:5432/scamdb_test
          SECRET_KEY: test-secret-key-for-ci
          APP_ENV: testing
        run: |
          python -m pytest tests/ -v --cov=backend --cov=enterprise_pipeline \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=80 \
            -x --timeout=60

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage.xml
          retention-days: 30

  # ===========================================================================
  # Docker Build
  # ===========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Build Validation
  # ===========================================================================
  validate:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [security, test]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate Deployment Files
        run: |
          python -c "import yaml; yaml.safe_load(open('deploy/k8s/backend-deployment.yaml'))" || true
          python -c "import json; json.load(open('deploy/ecs/task-definition.json'))" || true
