# =============================================================================
# CD Pipeline — AI Cyber Scam Detector
# Multi-platform, multi-cloud enterprise deployment with SBOM signing & verification
# =============================================================================
name: CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: choice
        options:
          - staging
          - production
        default: staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # SBOM Generation & Security Signing
  # ===========================================================================
  sbom:
    name: Generate SBOM & Attestations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate SBOM (backend)
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: cyclonedx-json
          output-file: sbom-backend.json

      - name: Generate SBOM (frontend)
        uses: anchore/sbom-action@v0
        with:
          path: ./frontend
          format: cyclonedx-json
          output-file: sbom-frontend.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign SBOMs
        run: |
          cosign sign-blob --yes sbom-backend.json --bundle sbom-backend.sig
          cosign sign-blob --yes sbom-frontend.json --bundle sbom-frontend.sig

      - name: Validate SBOM structure
        run: |
          python - <<'EOF'
          import json
          for name in ["sbom-backend.json", "sbom-frontend.json"]:
              with open(name) as f:
                  sbom = json.load(f)
              assert sbom.get("bomFormat", "").lower() == "cyclonedx"
              assert "components" in sbom
              print(f"{name}: OK - {len(sbom.get('components', []))} components")
          EOF

      - name: Verify SBOM signatures
        run: |
          cosign verify-blob --bundle sbom-backend.sig sbom-backend.json
          cosign verify-blob --bundle sbom-frontend.sig sbom-frontend.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom-*.json
            sbom-*.sig
          retention-days: 90

  # ===========================================================================
  # Docker Build & Publish — Backend (Multi-Arch)
  # ===========================================================================
  docker-backend:
    name: Build & Publish Backend
    runs-on: ubuntu-latest
    needs: [sbom]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=AI Cyber Scam Detector Backend
            org.opencontainers.image.description=Enterprise-grade scam detection API
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Enterprise AI Team
            org.opencontainers.image.licenses=Proprietary

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      - name: Generate attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

  # ===========================================================================
  # Docker Build & Publish — Frontend (Multi-Arch)
  # ===========================================================================
  docker-frontend:
    name: Build & Publish Frontend
    runs-on: ubuntu-latest
    needs: [sbom]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=AI Cyber Scam Detector Frontend
            org.opencontainers.image.description=Enterprise scam detection UI
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Enterprise AI Team
            org.opencontainers.image.licenses=Proprietary

      - name: Build and push
        id: docker_frontend_build
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      - name: Generate attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          subject-digest: ${{ steps.docker_frontend_build.outputs.digest }}
          push-to-registry: true

  # ===========================================================================
  # Deploy to Kubernetes (Staging/Production)
  # ===========================================================================
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eks
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name scam-detector-${{ matrix.environment }} --region us-east-1

      - name: Deploy with Helm
        run: |
          helm upgrade --install scam-detector ./deploy/helm/scam-detector \
            --namespace scam-detector \
            --create-namespace \
            --values deploy/environments/${{ matrix.environment }}.yaml \
            --set backend.image.tag=${{ github.ref_name }} \
            --set frontend.image.tag=${{ github.ref_name }} \
            --wait --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/scam-detector-backend -n scam-detector --timeout=5m
          kubectl rollout status deployment/scam-detector-frontend -n scam-detector --timeout=5m

  # ===========================================================================
  # Terraform Apply (Infrastructure)
  # ===========================================================================
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    if: false  # Disabled by default, enable for infra changes
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init
        working-directory: ./deploy/terraform

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var-file=../environments/production.tfvars
        working-directory: ./deploy/terraform

      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: ./deploy/terraform

  # ===========================================================================
  # Performance & Security Validation
  # ===========================================================================
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate Helm Chart
        run: |
          helm lint ./deploy/helm/scam-detector

      - name: Validate Kubernetes Manifests
        uses: stefanprodan/kube-score-action@v1
        with:
          directory: ./deploy/k8s

      - name: Validate Cloud Configs
        run: |
          python -c "import json; json.load(open('deploy/ecs/task-definition.json'))"
          python -c "import yaml; yaml.safe_load(open('deploy/azure/container-app.yaml'))"
          python -c "import yaml; yaml.safe_load(open('deploy/gcp/cloud-run.yaml'))"

  # ===========================================================================
  # Release
  # ===========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend, validate]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download SBOMs
        uses: actions/download-artifact@v8
        with:
          name: sbom

      - name: Generate Release Notes
        id: notes
        run: |
          echo "## Release ${{ github.ref_name }}" > release_notes.md
          echo "" >> release_notes.md
          echo "### Docker Images" >> release_notes.md
          echo "- backend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.ref_name }}" >> release_notes.md
          echo "- frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.ref_name }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "### SBOMs & Signatures" >> release_notes.md
          echo "- sbom-backend.json" >> release_notes.md
          echo "- sbom-backend.sig" >> release_notes.md
          echo "- sbom-frontend.json" >> release_notes.md
          echo "- sbom-frontend.sig" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            sbom-backend.json
            sbom-backend.sig
            sbom-frontend.json
            sbom-frontend.sig
          body_path: release_notes.md
          generate_release_notes: true
