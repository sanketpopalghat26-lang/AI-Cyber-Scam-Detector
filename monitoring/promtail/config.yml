# =============================================================================
# Promtail Configuration — Log Aggregation for Loki
# =============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: [localhost]
        labels:
          job: backend
          service: ai-cyber-scam-detector
          __path__: /var/log/backend/*.log
    pipeline_stages:
      - regex:
          expression: '^{.*}$'
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message

  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: ai-cyber-scam-detector
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            status: status
            request_uri: request_uri

