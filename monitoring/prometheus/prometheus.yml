
# =============================================================================
# Prometheus Configuration — AI Cyber Scam Detector
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: production
    project: ai-cyber-scam-detector

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Rule files
rule_files:
  - "alerts.yml"

scrape_configs:
  # Backend metrics
  - job_name: 'backend'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: backend
          tier: api

  # Node exporter for host metrics
  - job_name: 'node'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node-exporter
          tier: infrastructure

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: cadvisor
          tier: infrastructure

  # PostgreSQL exporter (if needed)
  - job_name: 'postgresql'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgresql
          tier: database

  # Redis exporter
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: redis
          tier: cache

  # Nginx exporter
  - job_name: 'nginx'
    scrape_interval: 15s
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: nginx
          tier: reverse-proxy

  # Prometheus itself
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']

