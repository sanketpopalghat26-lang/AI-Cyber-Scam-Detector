# =============================================================================
# Backend Deployment — AI Cyber Scam Detector
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scam-detector.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scam-detector.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.backend.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.backend.strategy.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "scam-detector.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scam-detector.backend.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        rollme: {{ randAlphaNum 5 | quote }}
    spec:
      {{- include "scam-detector.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ .Values.backend.serviceAccount.name }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-backend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
              name: http
              protocol: TCP
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "scam-detector.fullname" . }}-backend-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "scam-detector.fullname" . }}-backend-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "scam-detector.fullname" . }}-backend-secrets
                  key: REDIS_URL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "scam-detector.fullname" . }}-backend-secrets
                  key: REDIS_PASSWORD
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "scam-detector.fullname" . }}-backend-secrets
                  key: CSRF_SECRET
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{ include "scam-detector.probes" (dict "probes" .Values.backend.probes "port" .Values.backend.service.port) | nindent 10 }}
          volumeMounts:
            {{- toYaml .Values.backend.volumeMounts | nindent 12 }}
      volumes:
        {{- toYaml .Values.backend.volumes | nindent 8 }}
      topologySpreadConstraints:
        {{- toYaml .Values.backend.topologySpreadConstraints | nindent 8 }}
      affinity:
        {{- toYaml .Values.backend.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.backend.tolerations | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.backend.nodeSelector | nindent 8 }}
