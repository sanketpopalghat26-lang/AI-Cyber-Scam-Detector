# =============================================================================
# Pod Disruption Budgets — AI Cyber Scam Detector
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "scam-detector.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scam-detector.backend.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "scam-detector.backend.selectorLabels" . | nindent 6 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "scam-detector.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scam-detector.frontend.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "scam-detector.frontend.selectorLabels" . | nindent 6 }}
