# =============================================================================
# Backend Secrets — AI Cyber Scam Detector
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scam-detector.fullname" . }}-backend-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scam-detector.backend.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ .Values.backend.secrets.SECRET_KEY | b64enc | quote }}
  DATABASE_URL: {{ .Values.backend.secrets.DATABASE_URL | b64enc | quote }}
  REDIS_URL: {{ .Values.backend.secrets.REDIS_URL | b64enc | quote }}
  REDIS_PASSWORD: {{ .Values.backend.secrets.REDIS_PASSWORD | b64enc | quote }}
  CSRF_SECRET: {{ .Values.backend.secrets.CSRF_SECRET | b64enc | quote }}
