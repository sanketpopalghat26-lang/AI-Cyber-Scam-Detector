# =============================================================================
# Google Cloud Run Service — AI Cyber Scam Detector
# =============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: scam-detector-backend
  namespace: default
  annotations:
    run.googleapis.com/ingress: "internal-and-cloud-load-balancing"
    run.googleapis.com/ingress-status: "internal-and-cloud-load-balancing"
    run.googleapis.com/launch-stage: "GA"
    run.googleapis.com/cpu-throttling: "false"
    run.googleapis.com/startup-cpu-boost: "true"
    run.googleapis.com/vpc-access-connector: "projects/PROJECT_ID/locations/us-central1/connectors/scam-detector-connector"
    run.googleapis.com/vpc-access-egress: "private-ranges-only"
    run.googleapis.com/cloudsql-instances: "PROJECT_ID:us-central1:scam-detector-db"
    run.googleapis.com/session-affinity: "false"
    run.googleapis.com/execution-environment: "gen2"
    autoscaling.knative.dev/maxScale: "10"
    autoscaling.knative.dev/minScale: "2"
    run.googleapis.com/cpu-min: "1"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: "gen2"
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "2"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: scam-detector-backend@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: ghcr.io/organization/scam-detector-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: ENABLE_METRICS
              value: "true"
            - name: ENABLE_CACHE
              value: "true"
            - name: ENABLE_CSRF
              value: "true"
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: CORS_ORIGINS
              value: "https://app.scamdetector.example.com"
            - name: TRUSTED_HOSTS
              value: "api.scamdetector.example.com"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: "/tmp"
            - name: APP_VERSION
              value: "2.0.0"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: scam-detector-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: scam-detector-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: scam-detector-secrets
                  key: REDIS_URL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scam-detector-secrets
                  key: REDIS_PASSWORD
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: scam-detector-secrets
                  key: CSRF_SECRET
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
