# =============================================================================
# Persistent Volume Claims — AI Cyber Scam Detector
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: scam-detector
  labels:
    app: scam-detector
    tier: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: scam-detector
  labels:
    app: scam-detector
    tier: cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-data
  namespace: scam-detector
  labels:
    app: scam-detector
    tier: storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logs-data
  namespace: scam-detector
  labels:
    app: scam-detector
    tier: storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

