# =============================================================================
# Backend Service — AI Cyber Scam Detector
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: scam-detector
  labels:
    app: scam-detector
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 8000
      protocol: TCP
  selector:
    app: scam-detector
    tier: backend
---
apiVersion: v1
kind: Service
metadata:
  name: backend-headless
  namespace: scam-detector
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: scam-detector
    tier: backend

