# =============================================================================
# PriorityClass definitions — AI Cyber Scam Detector
# Ensures critical workloads are scheduled first during resource contention
# =============================================================================
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: scam-detector-critical
value: 1000000
globalDefault: false
description: "Critical scam detector workloads (backend API, database)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: scam-detector-high
value: 500000
globalDefault: false
description: "High priority scam detector workloads (frontend, monitoring exporters)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: scam-detector-low
value: 100000
globalDefault: false
description: "Low priority workloads (batch jobs, backups, non-critical)."
