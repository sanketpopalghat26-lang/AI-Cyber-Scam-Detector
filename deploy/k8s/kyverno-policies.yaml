# =============================================================================
# Kyverno Policies — AI Cyber Scam Detector
# Supply-chain, security, and compliance guardrails for all workloads.
# Apply with: kubectl apply -f deploy/k8s/kyverno-policies.yaml
# Requires the Kyverno operator to be installed.
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root-containers
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must run as non-root (runAsNonRoot: true)."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-ro-filesystem
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: read-only-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must use a read-only root filesystem."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-allowlist
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: only-allow-vetted-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Only images from allowed registries may be used."
        pattern:
          spec:
            containers:
              - image: "ghcr.io/*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-limits-and-requests
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must specify resource requests and limits."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-verify-image-signatures
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - image: "ghcr.io/*"
          key: "-----BEGIN PUBLIC KEY-----\n"
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: "kms://"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-readiness-and-liveness
      match:
        any:
          - resources:
              kinds:
                - Deployment
      validate:
        message: "Deployments must define readiness and liveness probes."
        pattern:
          spec:
            template:
              spec:
                containers:
                  - readinessProbe:
                      httpGet:
                        path: "/health/ready"
                  - livenessProbe:
                      httpGet:
                        path: "/health/live"
