# =============================================================================
# PostgreSQL StatefulSet — AI Cyber Scam Detector
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: scam-detector
  labels:
    app: scam-detector
    tier: database
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: scam-detector
      tier: database
  template:
    metadata:
      labels:
        app: scam-detector
        tier: database
    spec:
      serviceAccountName: db-sa
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums --auth=scram-sha-256"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: POSTGRES_USER
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: db-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
      volumes:
        - name: db-config
          configMap:
            name: db-config
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: scam-detector
  labels:
    app: scam-detector
    tier: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: scam-detector
    tier: database
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: scam-detector
data:
  postgresql.conf: |
    max_connections = 100
    shared_buffers = 512MB
    effective_cache_size = 1.5GB
    maintenance_work_mem = 128MB
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 200
    work_mem = 5242kB
    min_wal_size = 1GB
    max_wal_size = 4GB
    max_worker_processes = 8
    max_parallel_workers_per_gather = 4
    max_parallel_workers = 8
    max_parallel_maintenance_workers = 4

